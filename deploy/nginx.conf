map $http_user_agent $og_bot {
    default 0;
    ~*(facebookexternalhit|facebot|meta-externalagent|twitterbot|whatsapp|telegrambot|viber|linkedinbot|slackbot|discordbot|pinterest|skypeuripreview|redditbot|embedly|vkshare|bingpreview) 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location = /robots.txt { proxy_pass http://backend:8001/api/robots.txt; proxy_set_header Host $http_host; }
    location = /sitemap.xml { proxy_pass http://backend:8001/api/sitemap.xml; proxy_set_header Host $http_host; }

    # Social crawlers get server-rendered OpenGraph tags for articles
    location ~ ^/vijesti/(?<aslug>[^/]+)/?$ {
        error_page 418 = @og;
        if ($og_bot) { return 418; }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location @og {
        proxy_pass http://backend:8001/api/share/$aslug;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
