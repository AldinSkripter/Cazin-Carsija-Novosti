name: ccn

services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1})' || mongo --quiet --eval 'db.runCommand({ping:1})'"]
      interval: 10s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      STORAGE_MODE: local
      MEDIA_DIR: /data/media
    volumes:
      - ./data/media:/data/media
      - ./data/import:/data/import
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        SITE_URL: ${SITE_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      - backend

  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      TZ: Europe/Sarajevo
      WEBHOOK_CRON_SECRET: ${WEBHOOK_CRON_SECRET}
    volumes:
      - ./crontab:/etc/crontabs/root:ro
    command: sh -c "apk add --no-cache curl tzdata >/dev/null && crond -f -l 8"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ./data/ollama:/root/.ollama

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - frontend
